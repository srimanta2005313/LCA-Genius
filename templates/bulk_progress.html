{% extends "layout.html" %}

{% block content %}
<section class="h-screen w-full bg-slate-900 flex items-center justify-center p-4">
    <div class="glass-panel p-8 max-w-xl w-full rounded-2xl shadow-xl border border-sky-500/20 bg-slate-800/80 text-center">
        
        <div class="mb-6">
            <div class="w-20 h-20 mx-auto bg-sky-500/10 rounded-full flex items-center justify-center mb-4">
                <i class="fa-solid fa-microchip text-4xl text-sky-400 fa-pulse"></i>
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">Analyzing Bulk Data...</h2>
            <p class="text-gray-400 text-sm" id="status-text">Processing your LCA assessments. Please don't close this window.</p>
        </div>

        <div class="w-full bg-slate-700 rounded-full h-4 mb-4 overflow-hidden border border-gray-600">
            <div id="progress-bar" class="bg-gradient-to-r from-sky-500 to-indigo-500 h-4 rounded-full transition-all duration-300 relative" style="width: 0%">
                <div class="absolute inset-0 bg-white/20 animate-pulse"></div>
            </div>
        </div>
        
        <div class="flex justify-between text-sm font-semibold text-gray-300">
            <span id="progress-percent">0%</span>
            <span id="progress-count">0 / 0 Rows</span>
        </div>
        
    </div>
</section>

<!-- Socket.IO library from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const taskId = "{{ task_id }}";
        const socket = io();

        // Join room specific to this task
        socket.on('connect', () => {
            console.log("Connected to websocket");
            socket.emit('join_task', { task_id: taskId });
        });

        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');
        const progressCount = document.getElementById('progress-count');
        const statusText = document.getElementById('status-text');

        // Listen for progress updates
        socket.on('bulk_progress', function (data) {
            progressBar.style.width = data.progress + '%';
            progressPercent.textContent = data.progress + '%';
            progressCount.textContent = data.current + ' / ' + data.total + ' Rows';
            statusText.textContent = `Running AI models on row ${data.current} of ${data.total}...`;
        });

        // Listen for completion
        socket.on('bulk_complete', function (data) {
            progressBar.style.width = '100%';
            progressPercent.textContent = '100%';
            statusText.textContent = "Analysis Complete! Redirecting to Dashboard...";
            statusText.classList.replace('text-gray-400', 'text-green-400');
            
            setTimeout(() => {
                window.location.href = data.redirect_url;
            }, 1000);
        });
    });
</script>
{% endblock %}
